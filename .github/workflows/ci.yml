name: CI & Publish

on:
  push:
    branches: [main]
    # Le commit d'épinglage d'une release (scripts/ops/pin-selfhost-image.mjs
    # dans la source) ne touche que les composes et le journal. Sans ce filtre,
    # il relançait un build qui republiait `:<version>` sous un AUTRE digest que
    # celui épinglé : le tag de version ne désignait plus l'image de la release.
    paths-ignore:
      - "docker-compose*.yml"
      - "CHANGELOG.md"
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE: ghcr.io/physalis-cloud/physalis

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

  publish:
    name: Build & Push
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # VERSION sert aux tags de l'image. APP_VERSION alimente /api/health :
      # sans lui, l'image publiée annonce "unknown" et on ne sait pas dire
      # quelle version tourne chez un self-hébergeur. Le SHA court distingue
      # deux images qui partagent la même version de package.json.
      - name: Extract version from package.json
        run: |
          echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
          echo "APP_VERSION=$(node -p "require('./package.json').version")+${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:${{ github.sha }}
          # Même traitement que `deploy.yml` et `deploy-staging.yml` de la
          # source, le Dockerfile de l'overlay ayant les mêmes stages `deps` et
          # `prod-deps` : `mode=max` pour que les `npm ci` intermédiaires soient
          # exportés, `ignore-error` pour qu'un cache refusé ne casse pas la CI.
          # Ici le dépôt est PUBLIC, donc les minutes sont gratuites : ce qu'on
          # y gagne, c'est du temps d'attente, pas du budget.
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          # `CACHEBUST` retiré : aucun `ARG CACHEBUST` dans le Dockerfile de
          # l'overlay non plus — le build-arg était ignoré par Docker.
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
